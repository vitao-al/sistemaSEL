name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          CI: true

      - name: Unit tests
        run: npm test
        env:
          JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-build-jwt-secret-at-least-32-characters-long
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DATABASE_PROVIDER: postgres
          NEXT_PUBLIC_APP_URL: http://localhost:3000
